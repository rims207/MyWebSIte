<!doctype html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search Shoes | SmartShoes</title>
  <meta name="description" content="Search SmartShoes products by name, category, style, or brand.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="search">
  <div id="site-header"></div>
  <main class="page-shell search-page">
    <section class="content-hero compact">
      <span class="eyebrow">Search</span>
      <h1>Find your next pair</h1>
    </section>
    <form class="search-panel" id="search-form">
      <input type="search" id="search-input" placeholder="Search for sneakers, sandals, sports, formal, women, men..." aria-label="Search products">
      <button class="btn btn-primary" type="submit">Search</button>
    </form>
    <div id="search-results"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
