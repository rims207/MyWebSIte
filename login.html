<!doctype html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login / Register | SmartShoes</title>
  <meta name="description" content="Login, register, or continue as a guest at SmartShoes.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="content">
  <div id="site-header"></div>
  <main class="page-shell auth-page">
    <div class="auth-grid">
      <section class="info-card">
        <h2>Login</h2>
        <form>
          <label><span>Email</span><input type="email" placeholder="you@example.com"></label>
          <label><span>Password</span><input type="password" placeholder="Enter password"></label>
          <button class="btn btn-primary" type="button">Sign in</button>
          <a href="#" class="text-link">Forgot password?</a>
        </form>
      </section>

      <section class="info-card">
        <h2>Create an account</h2>
        <form>
          <label><span>Full name</span><input type="text" placeholder="Your full name"></label>
          <label><span>Email</span><input type="email" placeholder="you@example.com"></label>
          <label><span>Password</span><input type="password" placeholder="Create a password"></label>
          <button class="btn btn-dark" type="button">Register</button>
        </form>
      </section>
    </div>

    <section class="cta-box narrow">
      <h3>Prefer guest checkout?</h3>
      <a class="btn btn-outline" href="checkout.html">Continue without account</a>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
