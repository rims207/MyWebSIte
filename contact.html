<!doctype html>
<html lang="en-PK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact SmartShoes</title>
  <meta name="description" content="Contact SmartShoes for support, product questions, or wholesale enquiries.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="content">
  <div id="site-header"></div>
  <main class="page-shell contact-page">
    <section class="content-hero text-center">
      <span class="eyebrow">Support</span>
      <h1>We’re here to help</h1>
      <p>Questions about sizing, delivery, or ordering? Reach out and our team will guide you.</p>
    </section>

    <section class="contact-grid">
      <div class="info-card">
        <h3>Contact details</h3>
        <ul class="info-list">
          <li><strong>Phone / WhatsApp:</strong> +92 300 1234567</li>
          <li><strong>Email:</strong> hello@smartshoes.pk</li>
          <li><strong>Business hours:</strong> Mon-Sat, 9:00 AM – 8:00 PM</li>
        </ul>
      </div>

      <form class="info-card form-card" id="contact-form">
        <h3>Send a message</h3>
        <div class="form-grid two">
          <label><span>Name</span><input type="text" name="name" required></label>
          <label><span>Phone / Email</span><input type="text" name="contact" required></label>
          <label class="full"><span>Subject</span><input type="text" name="subject" required></label>
          <label class="full"><span>Message</span><textarea rows="5" name="message" required></textarea></label>
        </div>
        <button type="submit" class="btn btn-primary">Send message</button>
        <p id="contact-status" class="status-note" role="status"></p>
      </form>
    </section>

    <section class="cta-box narrow">
      <h3>Need quick help?</h3>
      <a class="btn btn-dark" href="faq.html">Visit FAQs</a>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
